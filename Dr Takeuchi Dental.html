<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doug Takeuchi, DDS — San Jose Dentist</title>
  <link rel="icon" type="image/png" href="uploads/TakeuchiFavicon-e9fd53c7.png" />
  <meta name="ext-resource-dependency" content="uploads/Doug Takeuchi Logo web.png" data-resource-id="logo" />
  <meta name="ext-resource-dependency" content="uploads/TakeuchiTeamShot2.jpeg" data-resource-id="heroBg" />
  <meta name="ext-resource-dependency" content="uploads/DTakeuchiHeadshot.jpeg" data-resource-id="headshot" />
  <meta name="ext-resource-dependency" content="uploads/TakeuchiExterior.png" data-resource-id="exteriorBg" />
  <meta name="ext-resource-dependency" content="uploads/Screenshot 2026-04-26 at 12.32.55 PM.png" data-resource-id="mapImg" />
  <template id="__bundler_thumbnail" data-bg-color="#fcfaf8">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" fill="#fcfaf8"/>
      <circle cx="100" cy="100" r="60" fill="#2a9d8f"/>
      <path d="M82 70c-10 0-16 8-16 16 0 8 4 14 6 20 2 8 2 16 2 24 0 8 2 12 8 12s8-8 8-14c0-2 1-2 2-2s2 0 2 2c0 6 4 14 12 14s8-4 8-12c0-8 0-16 2-24 2-6 6-12 6-20 0-8-6-16-16-16-4 0-8 2-12 6-4-4-8-6-12-6z" fill="#fff"/>
    </svg>
  </template>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: oklch(0.985 0.008 60); color: oklch(0.18 0.02 240); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: oklch(0.75 0.06 195); border-radius: 3px; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    .fade-up { animation: fadeUp 0.7s ease both; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.22s; }
    .delay-3 { animation-delay: 0.36s; }
    .delay-4 { animation-delay: 0.52s; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel">



const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#2a9d8f",
  "heroHeadline": "Your Smile Deserves a Doctor You Trust",
  "showBanner": true,
  "ctaLabel": "Book a Free Consultation",
  "font": "Playfair Display"
} /*EDITMODE-END*/;

// ─── TOKENS ──────────────────────────────────────────────────────────────────
const T = {
  teal: "oklch(0.52 0.13 192)",
  tealLight: "oklch(0.94 0.04 192)",
  tealMid: "oklch(0.70 0.09 192)",
  gold: "oklch(0.72 0.13 82)",
  goldLight: "oklch(0.95 0.04 82)",
  slate: "oklch(0.18 0.02 240)",
  slateMid: "oklch(0.40 0.02 240)",
  slateLight: "oklch(0.62 0.02 240)",
  white: "oklch(0.985 0.008 60)",
  offWhite: "oklch(0.97 0.01 60)",
  surface: "oklch(0.975 0.012 60)"
};

// ─── ICONS ───────────────────────────────────────────────────────────────────
const Icon = ({ name, size = 22, color = "currentColor" }) => {
  const paths = {
    tooth: "M8 2C5.5 2 4 4 4 6c0 2 1 3.5 1.5 5C6 13 6 15 6 17c0 2 .5 3 2 3s2-2 2-3.5c0-.5.3-.5.5-.5s.5 0 .5.5C11 18 12 20 14 20s2-1 2-3c0-2 0-4 .5-6C17 9.5 18 8 18 6c0-2-1.5-4-4-4-1 0-2 .5-3 1.5C10 2.5 9 2 8 2z",
    star: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
    phone: "M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z",
    calendar: "M8 2v3M16 2v3M3 8h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",
    check: "M20 6L9 17l-5-5",
    shield: "M12 2L3 7v6c0 5.25 3.75 10.15 9 11.25C17.25 23.15 21 18.25 21 13V7L12 2z",
    smile: "M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01M22 12c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2s10 4.48 10 10z",
    sparkle: "M12 3v3m0 12v3m9-9h-3M6 12H3m12.36-6.36-2.12 2.12M8.46 15.54l-2.12 2.12m12.02 0-2.12-2.12M8.46 8.46 6.34 6.34",
    map: "M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0zM12 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",
    users: "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
    implant: "M12 2v6m0 0c-2.5 0-5 1.5-5 4v8h10v-8c0-2.5-2.5-4-5-4zM9 20h6",
    sedation: "M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18",
    chevron: "M19 9l-7 7-7-7",
    arrow: "M5 12h14M12 5l7 7-7 7",
    close: "M18 6L6 18M6 6l12 12"
  };
  const d = paths[name] || paths.star;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24"
    fill={name === "star" || name === "tooth" ? color : "none"}
    stroke={name === "star" || name === "tooth" ? "none" : color}
    strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d={d} />
    </svg>);

};

// ─── TOP BANNER ──────────────────────────────────────────────────────────────
const Banner = ({ tweaks }) => {
  const [show, setShow] = React.useState(true);
  if (!tweaks.showBanner || !show) return null;
  return (
    <div style={{
      background: T.teal, color: "#fff", textAlign: "center",
      padding: "10px 20px", fontSize: 14, fontWeight: 500,
      display: "flex", alignItems: "center", justifyContent: "center", gap: 12,
      position: "relative"
    }}>
      <Icon name="sparkle" size={16} color="#fff" />
      New patients welcome — book this month and receive a <strong style={{ marginLeft: 4 }}>complimentary whitening consult</strong>
      <button onClick={() => setShow(false)} style={{
        position: "absolute", right: 16, background: "none", border: "none",
        color: "#fff", cursor: "pointer", opacity: 0.8, lineHeight: 1
      }}>
        <Icon name="close" size={16} color="#fff" />
      </button>
    </div>);

};

// ─── NAV ─────────────────────────────────────────────────────────────────────
const Nav = ({ tweaks }) => {
  const [scrolled, setScrolled] = React.useState(false);
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [isMobile, setIsMobile] = React.useState(window.innerWidth < 768);

  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    const onResize = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener("scroll", onScroll);
    window.addEventListener("resize", onResize);
    return () => { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onResize); };
  }, []);

  const links = ["Services", "About", "Reviews", "Contact"];
  const solidBg = scrolled || menuOpen;

  return (
    <div style={{ position: "sticky", top: 0, zIndex: 100 }}>
      <nav style={{
        background: solidBg ? "rgba(252,250,248,0.97)" : "transparent",
        backdropFilter: solidBg ? "blur(12px)" : "none",
        borderBottom: scrolled ? `1px solid oklch(0.90 0.01 60)` : "1px solid transparent",
        transition: "all 0.35s ease",
        padding: "0 clamp(20px, 5vw, 80px)",
        display: "flex", alignItems: "center", justifyContent: "space-between",
        height: 68
      }}>
        <a href="#" style={{ textDecoration: "none", display: "flex", alignItems: "center" }}>
          <img src={window.__resources.logo} alt="Doug Takeuchi, DDS"
            style={{ height: 48, width: "auto", display: "block", objectFit: "contain" }} />
        </a>

        {isMobile ? (
          <button onClick={() => setMenuOpen((o) => !o)} aria-label="Toggle menu" style={{
            background: "none", border: "none", cursor: "pointer", padding: 8,
            display: "flex", flexDirection: "column", justifyContent: "center", gap: 5
          }}>
            <span style={{
              display: "block", width: 24, height: 2, borderRadius: 2,
              background: menuOpen ? T.teal : T.slate, transition: "all 0.3s",
              transform: menuOpen ? "rotate(45deg) translate(5px, 5px)" : ""
            }} />
            <span style={{
              display: "block", width: 24, height: 2, borderRadius: 2,
              background: menuOpen ? T.teal : T.slate, transition: "all 0.3s",
              opacity: menuOpen ? 0 : 1
            }} />
            <span style={{
              display: "block", width: 24, height: 2, borderRadius: 2,
              background: menuOpen ? T.teal : T.slate, transition: "all 0.3s",
              transform: menuOpen ? "rotate(-45deg) translate(5px, -5px)" : ""
            }} />
          </button>
        ) : (
          <div style={{ display: "flex", gap: 32, alignItems: "center" }}>
            {links.map((l) =>
            <a key={l} href={`#${l.toLowerCase()}`} style={{
              textDecoration: "none", color: T.slateMid, fontSize: 14, fontWeight: 500,
              transition: "color 0.2s"
            }}
            onMouseEnter={(e) => e.target.style.color = T.teal}
            onMouseLeave={(e) => e.target.style.color = T.slateMid}>
              {l}</a>
            )}
            <a href="#contact" style={{
              background: tweaks.accentColor || T.teal, color: "#fff",
              padding: "9px 22px", borderRadius: 30, fontSize: 14, fontWeight: 600,
              textDecoration: "none", transition: "opacity 0.2s, transform 0.15s",
              display: "flex", alignItems: "center", gap: 7
            }}
            onMouseEnter={(e) => {e.currentTarget.style.opacity = "0.88";e.currentTarget.style.transform = "translateY(-1px)";}}
            onMouseLeave={(e) => {e.currentTarget.style.opacity = "1";e.currentTarget.style.transform = "";}}>
              <Icon name="phone" size={14} color="#fff" />
              408-295-5651
            </a>
          </div>
        )}
      </nav>

      {/* Mobile dropdown menu */}
      {isMobile && menuOpen && (
        <div style={{
          background: "rgba(252,250,248,0.97)", backdropFilter: "blur(12px)",
          borderBottom: `1px solid oklch(0.90 0.01 60)`,
          padding: "16px clamp(20px, 5vw, 80px) 28px",
          display: "flex", flexDirection: "column"
        }}>
          {links.map((l) =>
          <a key={l} href={`#${l.toLowerCase()}`}
            onClick={() => setMenuOpen(false)}
            style={{
              textDecoration: "none", color: T.slate, fontSize: 18, fontWeight: 500,
              padding: "14px 0", borderBottom: `1px solid oklch(0.92 0.01 60)`,
              display: "block"
            }}>
            {l}
          </a>
          )}
          <a href="tel:4082955651" style={{
            marginTop: 20, background: tweaks.accentColor || T.teal, color: "#fff",
            padding: "14px 22px", borderRadius: 50,
            textDecoration: "none", fontWeight: 600, fontSize: 15,
            display: "flex", alignItems: "center", justifyContent: "center", gap: 9
          }}>
            <Icon name="phone" size={16} color="#fff" />
            Call 408-295-5651
          </a>
        </div>
      )}
    </div>);

};

// ─── HERO ────────────────────────────────────────────────────────────────────
const Hero = ({ tweaks }) => {
  const [formState, setFormState] = React.useState({ name: "", phone: "", service: "", submitted: false });
  const services = ["Teeth Whitening", "Dental Implants", "Invisalign®", "Sedation Dentistry", "General Checkup", "Emergency Care"];

  const handleSubmit = (e) => {
    e.preventDefault();
    setFormState((s) => ({ ...s, submitted: true }));
  };

  return (
    <section style={{
      minHeight: "calc(100vh - 68px)",
      background: `linear-gradient(135deg, oklch(0.10 0.025 240 / 0.48) 0%, oklch(0.18 0.04 220 / 0.42) 60%, oklch(0.24 0.07 190 / 0.38) 100%), url(${window.__resources.heroBg}) center/cover no-repeat`,
      display: "flex", alignItems: "center",
      padding: "60px clamp(20px,6vw,100px)",
      position: "relative", overflow: "hidden"
    }}>
      {/* Decorative orb */}
      <div style={{
        position: "absolute", top: -120, right: -80, width: 600, height: 600,
        borderRadius: "50%",
        background: "radial-gradient(circle, oklch(0.52 0.13 192 / 0.18) 0%, transparent 70%)",
        pointerEvents: "none"
      }} />
      <div style={{
        position: "absolute", bottom: -200, left: -100, width: 500, height: 500,
        borderRadius: "50%",
        background: "radial-gradient(circle, oklch(0.72 0.13 82 / 0.10) 0%, transparent 70%)",
        pointerEvents: "none"
      }} />

      <div style={{
        maxWidth: 1200, margin: "0 auto", width: "100%",
        display: "grid", gridTemplateColumns: "1fr 420px", gap: 60, alignItems: "center"
      }}>
        {/* Left copy */}
        <div>
          <div className="fade-up" style={{
            display: "inline-flex", alignItems: "center", gap: 8,
            background: "oklch(0.52 0.13 192 / 0.18)", border: "1px solid oklch(0.52 0.13 192 / 0.35)",
            borderRadius: 30, padding: "6px 16px", marginBottom: 28
          }}>
            <Icon name="shield" size={14} color={T.tealMid} />
            <span style={{ fontSize: 12, fontWeight: 600, color: T.tealMid, letterSpacing: "0.06em", textTransform: "uppercase" }}>
              20+ Years · San Jose's Trusted Dentist
            </span>
          </div>

          <h1 className="fade-up delay-1" style={{
            fontFamily: `'${tweaks.font || "Playfair Display"}',serif`,
            fontSize: "clamp(38px,4.5vw,64px)", fontWeight: 700,
            color: "#fff", lineHeight: 1.12, marginBottom: 24,
            textWrap: "pretty", margin: "0px 0px 24px"
          }}>
            {tweaks.heroHeadline}
          </h1>

          <p className="fade-up delay-2" style={{
            fontSize: 18, color: "#fff", lineHeight: 1.7,
            maxWidth: 520, marginBottom: 40
          }}>
            Dr. Doug Takeuchi brings comfort-first, anxiety-free dentistry to every appointment — from routine cleanings to full smile makeovers. New patients always welcome.
          </p>

          <div className="fade-up delay-3" style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 52 }}>
            <a href="#contact" style={{
              background: tweaks.accentColor || T.teal,
              color: "#fff", padding: "15px 32px", borderRadius: 50,
              textDecoration: "none", fontWeight: 600, fontSize: 16,
              display: "flex", alignItems: "center", gap: 9,
              transition: "transform 0.2s, box-shadow 0.2s",
              boxShadow: `0 6px 28px ${tweaks.accentColor || T.teal}55`
            }}
            onMouseEnter={(e) => {e.currentTarget.style.transform = "translateY(-2px)";e.currentTarget.style.boxShadow = `0 12px 36px ${tweaks.accentColor || T.teal}66`;}}
            onMouseLeave={(e) => {e.currentTarget.style.transform = "";e.currentTarget.style.boxShadow = `0 6px 28px ${tweaks.accentColor || T.teal}55`;}}>
              
              {tweaks.ctaLabel || "Book a Free Consultation"}
              <Icon name="arrow" size={16} color="#fff" />
            </a>
            <a href="tel:4082955651" style={{
              background: "oklch(1 0 0 / 0.12)", border: "1px solid oklch(1 0 0 / 0.25)",
              color: "#fff", padding: "15px 28px", borderRadius: 50,
              textDecoration: "none", fontWeight: 500, fontSize: 16,
              display: "flex", alignItems: "center", gap: 9,
              transition: "background 0.2s"
            }}
            onMouseEnter={(e) => e.currentTarget.style.background = "oklch(1 0 0 / 0.20)"}
            onMouseLeave={(e) => e.currentTarget.style.background = "oklch(1 0 0 / 0.12)"}>
              
              <Icon name="phone" size={16} color="#fff" />
              Call Now
            </a>
          </div>

          {/* Social proof strip */}
          <div className="fade-up delay-4" style={{ display: "flex", gap: 32, flexWrap: "wrap" }}>
            {[
            { n: "20+", label: "Years in Practice" },
            { n: "500+", label: "Five-Star Reviews" },
            { n: "2,000+", label: "Families Served" }].
            map((item, i) =>
            <div key={i}>
                <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 30, fontWeight: 700, color: "#fff", lineHeight: 1 }}>{item.n}</div>
                <div style={{ fontSize: 12, color: "#fff", marginTop: 4 }}>{item.label}</div>
              </div>
            )}
          </div>
        </div>

        {/* Right: lead form */}
        <div style={{
          background: "oklch(0.985 0.008 60)", borderRadius: 20,
          padding: "36px 32px", boxShadow: "0 32px 80px oklch(0 0 0 / 0.35)"
        }}>
          {formState.submitted ?
          <div style={{ textAlign: "center", padding: "40px 0" }}>
              <div style={{
              width: 64, height: 64, borderRadius: "50%",
              background: T.tealLight, display: "flex", alignItems: "center",
              justifyContent: "center", margin: "0 auto 20px"
            }}>
                <Icon name="check" size={28} color={T.teal} />
              </div>
              <h3 style={{ fontFamily: "'Playfair Display',serif", fontSize: 22, marginBottom: 10, color: T.slate }}>
                We'll be in touch!
              </h3>
              <p style={{ color: T.slateMid, fontSize: 15, lineHeight: 1.6 }}>
                Our team will call you within one business hour to confirm your appointment.
              </p>
              <div style={{ marginTop: 20, padding: "14px 20px", background: T.tealLight, borderRadius: 12 }}>
                <div style={{ fontSize: 13, color: T.teal, fontWeight: 600 }}>Or call us directly:</div>
                <div style={{ fontSize: 20, fontWeight: 700, color: T.slate, marginTop: 4 }}>408-295-5651</div>
              </div>
            </div> :

          <>
              <div style={{ marginBottom: 24 }}>
                <div style={{
                display: "inline-flex", alignItems: "center", gap: 6,
                background: T.goldLight, borderRadius: 20, padding: "5px 12px", marginBottom: 12
              }}>
                  <Icon name="sparkle" size={13} color={T.gold} />
                  <span style={{ fontSize: 11, fontWeight: 700, color: T.gold, letterSpacing: "0.05em", textTransform: "uppercase" }}>Free Consultation</span>
                </div>
                <h2 style={{ fontFamily: "'Playfair Display',serif", fontSize: 24, color: T.slate, lineHeight: 1.3, marginBottom: 8 }}>
                  Request Your Appointment
                </h2>
                <p style={{ fontSize: 14, color: T.slateMid, lineHeight: 1.5 }}>
                  No insurance? No problem. We offer flexible financing and CareCredit.
                </p>
              </div>

              <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div>
                  <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: T.slateMid, marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.05em" }}>Full Name</label>
                  <input
                  type="text" required placeholder="Jane Smith"
                  value={formState.name}
                  onChange={(e) => setFormState((s) => ({ ...s, name: e.target.value }))}
                  style={{
                    width: "100%", padding: "12px 14px", border: `1.5px solid oklch(0.88 0.01 60)`,
                    borderRadius: 10, fontSize: 15, outline: "none",
                    fontFamily: "'DM Sans',sans-serif",
                    background: T.offWhite, color: T.slate,
                    transition: "border-color 0.2s"
                  }}
                  onFocus={(e) => e.target.style.borderColor = tweaks.accentColor || T.teal}
                  onBlur={(e) => e.target.style.borderColor = "oklch(0.88 0.01 60)"} />
                
                </div>
                <div>
                  <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: T.slateMid, marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.05em" }}>Phone Number</label>
                  <input
                  type="tel" required placeholder="(408) 555-0000"
                  value={formState.phone}
                  onChange={(e) => setFormState((s) => ({ ...s, phone: e.target.value }))}
                  style={{
                    width: "100%", padding: "12px 14px", border: `1.5px solid oklch(0.88 0.01 60)`,
                    borderRadius: 10, fontSize: 15, outline: "none",
                    fontFamily: "'DM Sans',sans-serif",
                    background: T.offWhite, color: T.slate,
                    transition: "border-color 0.2s"
                  }}
                  onFocus={(e) => e.target.style.borderColor = tweaks.accentColor || T.teal}
                  onBlur={(e) => e.target.style.borderColor = "oklch(0.88 0.01 60)"} />
                
                </div>
                <div>
                  <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: T.slateMid, marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.05em" }}>I'm Interested In</label>
                  <select
                  value={formState.service}

const FloatingCTA = ({ tweaks }) => {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const fn = () => setVisible(window.scrollY > 400);
    window.addEventListener("scroll", fn);
    return () => window.removeEventListener("scroll", fn);
  }, []);
  return (
    <a href="tel:4082955651" style={{
      position: "fixed", bottom: 28, right: 28, zIndex: 200,
      background: tweaks.accentColor || T.teal,
      color: "#fff", borderRadius: 50,

      textDecoration: "none", fontWeight: 700, fontSize: 15,
      boxShadow: `0 8px 32px ${tweaks.accentColor || T.teal}66`,
      transform: visible ? "translateY(0)" : "translateY(120px)",
      opacity: visible ? 1 : 0,
      transition: "transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.3s"
    }}>
